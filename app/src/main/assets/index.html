<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>চিলাউড়া সোহাগ এন্ড ফারহান স্পোর্টস ক্লাব</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f3;color:#143d2b;font:16px system-ui,sans-serif}.app{max-width:520px;margin:auto;padding-bottom:85px}header{background:linear-gradient(120deg,#07543b,#0c7851);color:white;padding:26px 18px;border-radius:0 0 22px 22px}header h1{font-size:21px;line-height:1.6;margin:10px 0}.crest{width:65px;height:65px;border:2px solid #e8c46a;border-radius:50%;display:grid;place-items:center;font-size:31px}main{padding:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.tile,.card{background:white;border:1px solid #dce9e0;border-radius:14px;padding:16px;margin:8px 0;box-shadow:0 2px 8px #143d2b08}.tile{text-align:center;cursor:pointer;font-size:14px}.tile span{display:block;font-size:27px;margin-bottom:7px}h2{font-size:19px}.muted{color:#64796d;font-size:13px}.warning{background:#fff4d9;padding:10px;border-radius:10px;color:#6a4a0b;font-size:12px}input,textarea,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #c5d7ca;border-radius:9px;font:inherit}textarea{min-height:95px}button{cursor:pointer}.btn{background:#086143;color:white;border:0;border-radius:9px;padding:11px;font:inherit;margin:4px}.secondary{background:#e2efe6;color:#07543b}.danger{background:#a32c2c}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:white;display:flex;justify-content:space-around;border-top:1px solid #d6e5d9;padding:10px 3px}nav button{border:0;background:none;color:#275b43;font:12px system-ui}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.desc{white-space:pre-wrap;line-height:1.6}
</style></head><body><div class="app"><header><div class="crest">⚽</div><h1 id="clubname">চিলাউড়া সোহাগ এন্ড ফারহান স্পোর্টস ক্লাব</h1><div id="tagline">ঐক্য • খেলাধুলা • সমাজসেবা</div></header><main><p class="warning" id="status">ডেমো মোড: পরিবর্তন শুধু এই ফোনে সংরক্ষিত হবে। অনলাইন ডেটাবেস সংযোগ বাকি।</p><div id="view"></div></main><nav><button onclick="go('home')">🏠 হোম</button><button onclick="go('members')">👥 সদস্য</button><button onclick="go('donations')">💚 ডোনেশন</button><button onclick="go('notices')">📢 নোটিশ</button><button onclick="go('admin')">🔐 অ্যাডমিন</button></nav></div><script src="config.js"></script><script>
const labels={members:'সদস্য',advisors:'উপদেষ্টা',founders:'প্রতিষ্ঠাতা',committee:'কার্যকরী কমিটি',donations:'ডোনেশন',expenses:'আয়-ব্যয়',notices:'নোটিশ',events:'ইভেন্ট',gallery:'গ্যালারি'};
const icons={members:'👥',advisors:'🎓',founders:'🏅',committee:'📋',donations:'💚',expenses:'💰',notices:'📢',events:'🏆',gallery:'📷'};
const defaults={name:'চিলাউড়া সোহাগ এন্ড ফারহান স্পোর্টস ক্লাব',tagline:'ঐক্য • খেলাধুলা • সমাজসেবা',welcome:'আমাদের ক্লাবের তথ্য ও কার্যক্রম',about:'',contact:''};
let page='home',data={},settings={},editing=null;const $=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;':'&quot;',"'":'&#39;'}[c]));
function read(){try{data=JSON.parse(localStorage.getItem('club-data')||'{}');settings={...defaults,...JSON.parse(localStorage.getItem('club-settings')||'{}')}}catch(e){data={};settings={...defaults}}for(const k in labels)if(!Array.isArray(data[k]))data[k]=[]}
function persist(){localStorage.setItem('club-data',JSON.stringify(data));localStorage.setItem('club-settings',JSON.stringify(settings))}
function go(p){page=p;editing=null;draw()}
function draw(){ $('clubname').textContent=settings.name;$('tagline').textContent=settings.tagline;const v=$('view');if(page==='home'){v.innerHTML='<h2>'+safe(settings.welcome)+'</h2><div class="grid">'+Object.keys(labels).map(k=>'<div class="tile" onclick="go(\''+k+'\')"><span>'+icons[k]+'</span>'+labels[k]+'</div>').join('')+'</div><div class="card"><h3>ক্লাব পরিচিতি</h3><div class="desc">'+safe(settings.about||'এখানে ক্লাবের পরিচিতি যুক্ত করা যাবে।')+'</div></div>';return}
if(page==='admin'){v.innerHTML='<h2>সুপার অ্যাডমিন প্যানেল</h2><p class="warning">এটি শুধুমাত্র এই ফোনে চালু ডেমো সম্পাদনা ব্যবস্থা। নিরাপদ অনলাইন অ্যাডমিন লগইন এখনো সক্রিয় নয়।</p><div class="grid">'+Object.keys(labels).map(k=>'<div class="tile" onclick="go(\''+k+'\')"><span>'+icons[k]+'</span>'+labels[k]+' পরিচালনা</div>').join('')+'<div class="tile" onclick="go(\'settings\')"><span>⚙️</span>সব লেখা সম্পাদনা</div></div>';return}
if(page==='settings'){v.innerHTML='<h2>অ্যাপের লেখা সম্পাদনা</h2><form id="settingsForm">'+Object.keys(defaults).map(k=>'<label>'+({name:'ক্লাবের নাম',tagline:'স্লোগান',welcome:'স্বাগত বার্তা',about:'ক্লাব পরিচিতি',contact:'যোগাযোগ'}[k])+'<textarea name="'+k+'">'+safe(settings[k])+'</textarea></label>').join('')+'<button class="btn">সংরক্ষণ</button></form>';$('settingsForm').onsubmit=e=>{e.preventDefault();for(const [k,v] of new FormData(e.target))settings[k]=String(v);persist();go('home')};return}
v.innerHTML='<div class="row"><h2>'+labels[page]+'</h2><button class="btn" onclick="edit()">+ যোগ করুন</button></div><input id="q" placeholder="তথ্য খুঁজুন" oninput="list()"><div id="items"></div>';list()}
function list(){const q=($('q')?.value||'').toLowerCase(),a=data[page].filter(x=>(x.title+' '+x.detail).toLowerCase().includes(q));$('items').innerHTML=a.length?a.map(x=>'<div class="card"><b>'+safe(x.title)+'</b><p class="desc">'+safe(x.detail)+'</p>'+(page==='donations'||page==='expenses'?'<p>৳ '+safe(x.amount)+'</p>':'')+'<button class="btn secondary" onclick="edit('+x.id+')">সম্পাদনা</button><button class="btn danger" onclick="del('+x.id+')">মুছুন</button></div>').join(''):'<p class="muted">এখনো কোনো তথ্য নেই।</p>'}
function edit(id){editing=id||null;const x=data[page].find(x=>x.id===id)||{};$('view').innerHTML='<h2>'+labels[page]+' সম্পাদনা</h2><form id="form"><label>নাম / শিরোনাম<input name="title" required maxlength="150" value="'+safe(x.title||'')+'"></label><label>বিস্তারিত<textarea name="detail" maxlength="4000">'+safe(x.detail||'')+'</textarea></label>'+(page==='donations'||page==='expenses'?'<label>টাকার পরিমাণ<input type="number" min="0" step=".01" name="amount" value="'+safe(x.amount||0)+'"></label>':'')+'<button class="btn">সংরক্ষণ</button><button type="button" class="btn secondary" onclick="go(page)">বাতিল</button></form>';$('form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),o={id:editing||Date.now(),title:String(f.get('title')).trim(),detail:String(f.get('detail')).trim(),amount:Number(f.get('amount')||0)};if(editing){Object.assign(data[page].find(x=>x.id===editing),o)}else data[page].unshift(o);persist();go(page)}}
function del(id){if(confirm('এই তথ্য মুছবেন?')){data[page]=data[page].filter(x=>x.id!==id);persist();draw()}}
read();draw();
</script></body></html>
